<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Template 01</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="header">
    <h1>DERBAYMIX</h1>
    <p>Website toko musik digital</p>
        </div>
        <div class="product">
            <img src="file_0000000039ac8211adabc3ce733136e4.png" alt="DERBAYMIX SAMPLE PACK">
            <h3>DERBAYMIX SAMPLE PACK</h3>
<p>FLM.</p>
            <div class="music-player">

    <button class="play-button">
    <span class="play-icon">▶</span>
    </button>
    <div class="music-info">

        <div class="progress-bar">
    <div class="progress"></div>
    <div class="progress-knob"></div>
        </div>

        <div class="time-row">
            <span class="current-time">0:00</span>
            <span class="total-time">0:00</span>
        </div>

    </div>

            </div>

<audio id="audio">
    <source src="./body pata pata JDM STYLE.mp3" type="audio/mpeg">
</audio>
<p class="price">Rp10.000</p>
            <p class="sold">0 terjual</p>
            <a href="#" class="buy-button">BELI</a>
        </div>
    </div>

    <h1>STORE TEMPLATE 01</h1>

    <p>Website toko musik digital pertama kita.</p>

    <h2>Produk</h2>

    <h3>Produk Musik 01</h3>
    <p>Preview dan pembelian produk.</p>
    <p>Rp10.000</p>

    <button class="buy-button">BELI</button>
    <script>
    const audio = document.getElementById("audio");
    const playButton = document.querySelector(".play-button");
        const playIcon = document.querySelector(".play-icon");
    const progress = document.querySelector(".progress");
    const progressBar = document.querySelector(".progress-bar");
    const progressKnob = document.querySelector(".progress-knob");
    const currentTime = document.querySelector(".current-time");
    const totalTime = document.querySelector(".total-time");

    let isDragging = false;

    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return minutes + ":" + String(secs).padStart(2, "0");
    }

    function updateProgress(percent) {
        percent = Math.max(0, Math.min(1, percent));

        progress.style.width = (percent * 100) + "%";
        progressKnob.style.left = (percent * 100) + "%";

        if (audio.duration) {
            audio.currentTime = percent * audio.duration;
        }
    }

    function seekFromPointer(e) {
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;

        updateProgress(percent);
    }

    audio.addEventListener("loadedmetadata", function () {
        totalTime.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", function () {
        if (!isDragging) {
            const percent = audio.currentTime / audio.duration;

            progress.style.width = (percent * 100) + "%";
            progressKnob.style.left = (percent * 100) + "%";
        }

        currentTime.textContent = formatTime(audio.currentTime);
    });

    playButton.addEventListener("click", function () {
    if (audio.paused) {
        audio.play();
        playIcon.textContent = "";
        playIcon.classList.add("pause");
    } else {
        audio.pause();
        playIcon.textContent = "▶";
        playIcon.classList.remove("pause");
    }
});

    progressBar.addEventListener("pointerdown", function (e) {
        isDragging = true;
        progressBar.setPointerCapture(e.pointerId);
        seekFromPointer(e);
    });

    progressBar.addEventListener("pointermove", function (e) {
    if (isDragging) {
        e.preventDefault();
        seekFromPointer(e);
    }
});

    progressBar.addEventListener("pointerup", function () {
        isDragging = false;
    });

    progressBar.addEventListener("pointercancel", function () {
        isDragging = false;
    });

    audio.addEventListener("ended", function () {
        playButton.textContent = "▶";
        progress.style.width = "0%";
        progressKnob.style.left = "0%";
        currentTime.textContent = "0:00";
    });
    </script>
</body>
</html>
