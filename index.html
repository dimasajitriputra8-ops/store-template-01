<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Template 01</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="music-bg"></div>
    <div class="container">
        <div class="header">
    <h1>DERBAYMIX</h1>
    <p>Website toko musik digital</p>
        </div>
        <div class="product">
            <div class="product-image">
    <img src="file_0000000039ac8211adabc3ce733136e4.png" alt="DERBAYMIX SAMPLE PACK">

    <div class="mini-spectrum">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    </div>
            </div>
            <h3>DERBAYMIX SAMPLE PACK</h3>
<p>FLM.</p>
            <div class="music-player">

    <button class="play-button">
    <span class="play-icon">▶</span>
    </button>
    <div class="music-info">

        <div class="progress-bar">
    <div class="progress"></div>
    <div class="progress-knob"></div>
        </div>

        <div class="time-row">
            <span class="current-time">0:00</span>
            <span class="total-time">0:00</span>
        </div>

    </div>

            </div>

<audio id="audio">
    <source src="./body pata pata JDM STYLE.mp3" type="audio/mpeg">
</audio>
<p class="price">Rp10.000</p>
            <p class="sold">0 terjual</p>
            <a href="#" class="buy-button">BELI</a>
        </div>
    </div>

    <script>
    const audio = document.getElementById("audio");
    const playButton = document.querySelector(".play-button");
        const playIcon = document.querySelector(".play-icon");
    const progress = document.querySelector(".progress");
    const progressBar = document.querySelector(".progress-bar");
    const progressKnob = document.querySelector(".progress-knob");
    const currentTime = document.querySelector(".current-time");
    const totalTime = document.querySelector(".total-time");

    let isDragging = false;

    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return minutes + ":" + String(secs).padStart(2, "0");
    }

    function updateProgress(percent) {
        percent = Math.max(0, Math.min(1, percent));

        progress.style.width = (percent * 100) + "%";
        progressKnob.style.left = (percent * 100) + "%";

        if (audio.duration) {
            audio.currentTime = percent * audio.duration;
        }
    }

    function seekFromPointer(e) {
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;

        updateProgress(percent);
    }

    audio.addEventListener("loadedmetadata", function () {
        totalTime.textContent = formatTime(audio.duration);
    });

    let animationFrame;

audio.addEventListener("play", function () {
    function smoothProgress() {
        if (!audio.paused && !isDragging && audio.duration) {
            const percent = audio.currentTime / audio.duration;

            progress.style.width = (percent * 100) + "%";
            progressKnob.style.left = (percent * 100) + "%";
        }

        currentTime.textContent = formatTime(audio.currentTime);

        if (!audio.paused) {
            animationFrame = requestAnimationFrame(smoothProgress);
        }
    }

    cancelAnimationFrame(animationFrame);
    smoothProgress();
});

audio.addEventListener("pause", function () {
    cancelAnimationFrame(animationFrame);
});

    playButton.addEventListener("click", function () {
    if (audio.paused) {
        audio.play();
        playIcon.textContent = "";
        playIcon.classList.add("pause");
    } else {
        audio.pause();
        playIcon.textContent = "▶";
        playIcon.classList.remove("pause");
    }
});

    progressBar.addEventListener("pointerdown", function (e) {
        isDragging = true;
        progressBar.setPointerCapture(e.pointerId);
        seekFromPointer(e);
    });

    progressBar.addEventListener("pointermove", function (e) {
    if (isDragging) {
        e.preventDefault();
        seekFromPointer(e);
    }
});

    progressBar.addEventListener("pointerup", function () {
        isDragging = false;
    });

    progressBar.addEventListener("pointercancel", function () {
        isDragging = false;
    });

    audio.addEventListener("ended", function () {
    playIcon.textContent = "▶";
    playIcon.classList.remove("pause");
    progress.style.width = "0%";
    progressKnob.style.left = "0%";
    currentTime.textContent = "0:00";
});

        const spectrumBars = document.querySelectorAll(".mini-spectrum span");

const audioContext = new (window.AudioContext || window.webkitAudioContext)();
const analyser = audioContext.createAnalyser();
analyser.fftSize = 256;

const source = audioContext.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(audioContext.destination);

const frequencyData = new Uint8Array(analyser.frequencyBinCount);

function animateSpectrum() {
    analyser.getByteFrequencyData(frequencyData);

    // Ambil frekuensi rendah = area bass/kick
    const bass = frequencyData.slice(0, 10);

    const averageBass =
        bass.reduce((sum, value) => sum + value, 0) / bass.length;

    spectrumBars.forEach((bar, index) => {
    const frequencyIndex = index * 3;
    const frequency = frequencyData[frequencyIndex] || 0;

    const bassBoost = averageBass * (0.12 + index * 0.025);
    const height = 2 + (frequency * 0.18) + (bassBoost * 0.5);
    bar.style.height = Math.min(height, 22) + "px";
});

    requestAnimationFrame(animateSpectrum);
}

audio.addEventListener("play", function () {
    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    animateSpectrum();
});
        
    </script>
</body>
</html>
