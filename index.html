    <script>
    const products = document.querySelectorAll(".product");

products.forEach((product) => {
    const audio = product.querySelector("audio");
    const playButton = product.querySelector(".play-button");
    const playIcon = product.querySelector(".play-icon");
    const progress = product.querySelector(".progress");
    const progressBar = product.querySelector(".progress-bar");
    const progressKnob = product.querySelector(".progress-knob");
    const currentTime = product.querySelector(".current-time");
    const totalTime = product.querySelector(".total-time");
    const spectrumBars = product.querySelectorAll(".mini-spectrum span");

    let isDragging = false;
    let animationFrame;
    let spectrumAnimationFrame;
    let spectrumRunning = false;

    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return minutes + ":" + String(secs).padStart(2, "0");
    }

    function updateProgress(percent) {
        percent = Math.max(0, Math.min(1, percent));

        progress.style.width = (percent * 100) + "%";
        progressKnob.style.left = (percent * 100) + "%";

        if (audio.duration) {
            audio.currentTime = percent * audio.duration;
            currentTime.textContent = formatTime(audio.currentTime);
        }
    }

    function seekFromPointer(e) {
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;

        updateProgress(percent);
    }

    audio.addEventListener("loadedmetadata", function () {
        totalTime.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("play", function () {
        product.classList.add("playing");

        function smoothProgress() {
            if (!audio.paused && !isDragging && audio.duration) {
                const percent = audio.currentTime / audio.duration;

                progress.style.width = (percent * 100) + "%";
                progressKnob.style.left = (percent * 100) + "%";
            }

            currentTime.textContent = formatTime(audio.currentTime);

            if (!audio.paused) {
                animationFrame = requestAnimationFrame(smoothProgress);
            }
        }

        cancelAnimationFrame(animationFrame);
        smoothProgress();

        if (!spectrumRunning) {
            spectrumRunning = true;

            if (audioContext.state === "suspended") {
                audioContext.resume();
            }

            animateSpectrum();
        }
    });

    audio.addEventListener("pause", function () {
        cancelAnimationFrame(animationFrame);
        cancelAnimationFrame(spectrumAnimationFrame);

        spectrumRunning = false;
        product.classList.remove("playing");
    });

    playButton.addEventListener("click", function () {
        if (audio.paused) {
            audio.play();

            playIcon.textContent = "";
            playIcon.classList.add("pause");
        } else {
            audio.pause();

            playIcon.textContent = "▶";
            playIcon.classList.remove("pause");
        }
    });

    progressBar.addEventListener("pointerdown", function (e) {
        isDragging = true;
        progressBar.setPointerCapture(e.pointerId);
        seekFromPointer(e);
    });

    progressBar.addEventListener("pointermove", function (e) {
        if (isDragging) {
            e.preventDefault();
            seekFromPointer(e);
        }
    });

    progressBar.addEventListener("pointerup", function () {
        isDragging = false;
    });

    progressBar.addEventListener("pointercancel", function () {
        isDragging = false;
    });

    audio.addEventListener("ended", function () {
        product.classList.remove("playing");

        playIcon.textContent = "▶";
        playIcon.classList.remove("pause");

        progress.style.width = "0%";
        progressKnob.style.left = "0%";
        currentTime.textContent = "0:00";

        spectrumRunning = false;
        cancelAnimationFrame(spectrumAnimationFrame);
    });

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioContext.createAnalyser();

    analyser.fftSize = 256;

    const source = audioContext.createMediaElementSource(audio);

    source.connect(analyser);
    analyser.connect(audioContext.destination);

    const frequencyData = new Uint8Array(analyser.frequencyBinCount);

    function animateSpectrum() {
        if (!spectrumRunning) {
            return;
        }

        analyser.getByteFrequencyData(frequencyData);

        const bass = frequencyData.slice(0, 10);

        const averageBass =
            bass.reduce((sum, value) => sum + value, 0) / bass.length;

        spectrumBars.forEach((bar, index) => {
            const frequencyIndex = index * 3;
            const frequency = frequencyData[frequencyIndex] || 0;

            const bassBoost = averageBass * (0.12 + index * 0.025);
            const height = 2 + (frequency * 0.18) + (bassBoost * 0.5);

            bar.style.height = Math.min(height, 22) + "px";
        });

        spectrumAnimationFrame = requestAnimationFrame(animateSpectrum);
    }
});

        const shapes = document.querySelectorAll(".music-shape");

shapes.forEach((shape) => {
    shape.style.left = (5 + Math.random() * 90) + "%";
    shape.style.top = (5 + Math.random() * 90) + "%";
    shape.style.animationDuration = (6 + Math.random() * 8) + "s";
    shape.style.fontSize = (35 + Math.random() * 55) + "px";
    shape.style.opacity = (0.04 + Math.random() * 0.10).toFixed(2);
    shape.style.transform =
`rotate(${Math.random() * 70 - 35}deg)`;
});

const headphone = document.querySelector(".music-headphone");

headphone.style.left = (5 + Math.random() * 80) + "%";
headphone.style.top = (20 + Math.random() * 60) + "%";

        const backToTop = document.querySelector(".back-to-top");

window.addEventListener("scroll", function () {

        backToTop.style.display = "flex";
    } else {

    }
});

backToTop.addEventListener("click", function () {

        behavior: "smooth"
